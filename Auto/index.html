<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AutoGest — Gestion de Flotte Automobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===================== APPLICATION PRINCIPALE ===================== -->
<div id="app-screen">

  <!-- Sidebar Desktop -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
            <path d="M6 20l2-6h16l2 6H6z" fill="#F97316"/>
            <rect x="4" y="20" width="24" height="6" rx="3" fill="#F97316"/>
            <circle cx="10" cy="26" r="2.5" fill="white"/>
            <circle cx="22" cy="26" r="2.5" fill="white"/>
          </svg>
        </div>
        <span class="sidebar-logo-text">AutoGest</span>
      </div>
      <button class="sidebar-close-btn" onclick="UI.closeSidebar()" aria-label="Fermer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <ul class="sidebar-nav">
      <li>
        <button class="nav-item active" data-section="dashboard" onclick="Router.navigate('dashboard')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Tableau de Bord</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-section="garage" onclick="Router.navigate('garage')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Flotte Automobile</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-section="history" onclick="Router.navigate('history')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Historique & Pleins</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-section="glovebox" onclick="Router.navigate('glovebox')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          <span>Documents</span>
        </button>
      </li>
      <li>
        <button class="nav-item" data-section="guide" onclick="Router.navigate('guide')">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
          <span>Guide d'Entretien</span>
        </button>
      </li>
    </ul>

    <div class="sidebar-footer">
      <button class="nav-item" id="nav-item-employees" data-section="members" onclick="Router.navigate('members')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Gestion Employés</span>
      </button>
      <div class="sidebar-user" id="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-name">Chargement…</div>
          <div class="user-role" id="sidebar-role" style="font-size:0.75rem; color:var(--orange, #F97316); font-weight:600;">—</div>
          <button class="user-logout" onclick="Auth.logout()">Déconnexion</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Overlay mobile -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="UI.closeSidebar()"></div>

  <!-- Zone principale -->
  <div class="app-main" id="app-main">

    <!-- En-tête -->
    <header class="app-header">
      <button class="hamburger-btn" onclick="UI.openSidebar()" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-title" id="header-title">Tableau de Bord</div>
      <div class="header-actions">
        <!-- Sélecteur de véhicule -->
        <select id="vehicle-selector" class="vehicle-selector hidden" onchange="Router.onVehicleChange()">
          <option value="">— Choisir un véhicule —</option>
        </select>
        <button id="btn-add-primary" class="btn btn-orange" onclick="App.onAddPrimary()">
          + Ajouter un véhicule
        </button>
        
        <!-- Bouton Connexion vers la page auth.html -->
        <a href="connexion.html" class="btn btn-outline btn-sm" id="btn-header-login">Connexion</a>
      </div>
    </header>

    <!-- Contenu des sections -->
    <main class="app-content" id="app-content">
      <div class="section-loader">
        <div class="spinner"></div>
        <p>Chargement…</p>
      </div>
    </main>

  </div>

  <!-- Navigation bottom mobile -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-section="dashboard" onclick="Router.navigate('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Tableau</span>
    </button>
    <button class="bottom-nav-item" data-section="garage" onclick="Router.navigate('garage')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Flotte</span>
    </button>
    <button class="bottom-nav-item" data-section="history" onclick="Router.navigate('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Historique</span>
    </button>
    <button class="bottom-nav-item" data-section="glovebox" onclick="Router.navigate('glovebox')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      <span>Docs</span>
    </button>
    <button class="bottom-nav-item" data-section="guide" onclick="Router.navigate('guide')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
      <span>Guide</span>
    </button>
  </nav>
</div>

<!-- ===================== MODALS ===================== -->

<!-- Modal générique -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="UI.closeModal()">
  <div class="modal" id="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Titre</h3>
      <button class="modal-close" onclick="UI.closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Modal article guide (large) -->
<div id="guide-modal-overlay" class="modal-overlay hidden" onclick="UI.closeGuideModal()">
  <div class="modal modal-lg" id="guide-modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title" id="guide-modal-title">Article</h3>
      <button class="modal-close" onclick="UI.closeGuideModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="guide-modal-body"></div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast-container" class="toast-container"></div>

<script src="js/app.js"></script>
</body>
</html>
