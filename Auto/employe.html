<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Employé — AutoGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#F0F4F8] text-slate-800 font-sans min-h-screen flex overflow-hidden">

    <!-- PANNEAU LATÉRAL -->
    <aside class="w-72 bg-[#0B1629] text-white hidden md:flex flex-col shrink-0 shadow-2xl z-20 h-screen">
        <div class="p-6 border-b border-[#1E3A5F] flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center font-bold text-white shadow-lg shadow-orange-500/30">
                <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
                    <path d="M6 20l2-6h16l2 6H6z" fill="currentColor"/>
                    <rect x="4" y="20" width="24" height="6" rx="3" fill="currentColor"/>
                    <circle cx="10" cy="26" r="2.5" fill="white"/>
                    <circle cx="22" cy="26" r="2.5" fill="white"/>
                </svg>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide leading-tight">AutoGest</h1>
                <p class="text-xs text-orange-400 font-medium tracking-wider uppercase mt-0.5">Espace Employé</p>
            </div>
        </div>

        <nav class="p-4 flex-1 space-y-1 overflow-y-auto">
            <button onclick="App.nav('dashboard')" id="nav-dashboard" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-500 text-white font-semibold text-sm transition shadow-md shadow-orange-500/20 text-left">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Tableau de bord
            </button>
            <button onclick="App.nav('fleet')" id="nav-fleet" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#152844] text-slate-300 font-medium text-sm transition text-left">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Flotte Automobile
            </button>
            <button onclick="App.nav('history')" id="nav-history" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#152844] text-slate-300 font-medium text-sm transition text-left">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Historique & Pleins
            </button>
            <button onclick="App.nav('documents')" id="nav-documents" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#152844] text-slate-300 font-medium text-sm transition text-left">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Documents
            </button>
            <button onclick="App.nav('guide')" id="nav-guide" class="nav-link w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-[#152844] text-slate-300 font-medium text-sm transition text-left">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                Guide d'entretien
            </button>
        </nav>

        <div class="p-5 border-t border-[#1E3A5F] bg-[#070E1A]">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-[#1E3A5F] text-slate-300 font-bold flex items-center justify-center border border-[#2A4B7C]">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div class="overflow-hidden flex-1">
                    <p id="user-name-display" class="font-semibold text-sm text-white truncate">Chargement...</p>
                    <span class="text-xs text-orange-400 block font-medium">Employé</span>
                </div>
            </div>
            
            <button onclick="App.logout()" class="w-full flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 py-2.5 rounded-xl text-sm font-medium transition border border-red-500/20">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Se déconnecter
            </button>
        </div>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header id="app-header" class="bg-[#0B1629] text-white p-4 md:hidden flex justify-between items-center shadow-md z-20">
            <span class="font-bold tracking-wide">AutoGest</span>
            <button onclick="App.logout()" class="text-sm bg-red-500/20 text-red-400 px-3 py-1.5 rounded">Quitter</button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 md:p-10 w-full max-w-7xl mx-auto space-y-8">
            
            <!-- VUE 1 : TABLEAU DE BORD (Véhicule en cours uniquement) -->
            <div id="view-dashboard" class="view-section space-y-8">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Tableau de Bord</h2>
                <div>
                    <h3 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                        <svg class="w-6 h-6 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Mon véhicule en cours
                    </h3>
                    <div id="my-vehicle-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Généré dynamiquement -->
                    </div>
                </div>
            </div>

            <!-- VUE 2 : FLOTTE AUTOMOBILE (Véhicules disponibles) -->
            <div id="view-fleet" class="view-section hidden space-y-6">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Flotte Automobile</h2>
                <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2">
                    <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Véhicules disponibles à la réservation
                </h3>
                <div id="fleet-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

            <!-- VUE 3 : HISTORIQUE & PLEINS -->
            <div id="view-history" class="view-section hidden space-y-6">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Historique & Pleins de mon véhicule</h2>
                <div id="history-content" class="space-y-6">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

            <!-- VUE 4 : DOCUMENTS -->
            <div id="view-documents" class="view-section hidden space-y-6">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Documents de mon véhicule</h2>
                <div id="documents-content" class="space-y-6">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

            <!-- VUE 5 : GUIDE D'ENTRETIEN -->
            <div id="view-guide" class="view-section hidden space-y-6">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Guide d'Entretien</h2>
                <div id="guide-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Généré dynamiquement -->
                </div>
            </div>

        </main>
    </div>

    <script src="js/employe.js"></script>
</body>
</html>
