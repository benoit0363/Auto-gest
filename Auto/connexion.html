<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoGest — Authentification</title>
    <!-- Utilisation de Tailwind CSS pour la mise en forme rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Carte d'authentification -->
    <div class="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden">
        
        <!-- En-tête / Logo -->
        <div class="bg-orange-500 p-6 text-center text-white">
            <div class="flex justify-center mb-2">
                <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                    <path d="M6 20l2-6h16l2 6H6z" fill="currentColor"/>
                    <rect x="4" y="20" width="24" height="6" rx="3" fill="currentColor"/>
                    <circle cx="10" cy="26" r="2.5" fill="white"/>
                    <circle cx="22" cy="26" r="2.5" fill="white"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-wide">AutoGest</h1>
            <p class="text-orange-100 text-sm mt-1">Gestion de flotte d'entreprise</p>
        </div>

        <!-- Onglets (Connexion / Création) -->
        <div class="flex border-b text-sm font-medium">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-4 text-orange-600 border-b-2 border-orange-500 bg-orange-50/50">Connexion</button>
            <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-4 text-slate-500 hover:text-slate-700 transition">Créer Entreprise</button>
        </div>

        <div class="p-6 md:p-8">
            <!-- Formulaire de Connexion -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Adresse e-mail</label>
                    <input type="email" id="login-email" required placeholder="employe@entreprise.com" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mot de passe</label>
                    <input type="password" id="login-password" required placeholder="••••••••" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" />
                </div>
                <div id="login-error" class="text-red-500 text-sm font-medium hidden"></div>
                <button type="submit" id="btn-login" 
                        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center">
                    Se connecter
                </button>
            </form>

            <!-- Formulaire d'Inscription Administrateur -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-5 hidden">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nom de l'entreprise</label>
                    <input type="text" id="reg-name" required placeholder="Dupont Transport" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Adresse e-mail Admin</label>
                    <input type="email" id="reg-email" required placeholder="admin@entreprise.com" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mot de passe</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Minimum 6 caractères" 
                           class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition" />
                </div>
                <div id="register-error" class="text-red-500 text-sm font-medium hidden"></div>
                <button type="submit" id="btn-register" 
                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center">
                    Créer le compte Administrateur
                </button>
            </form>
        </div>
    </div>

    <!-- Lien vers le fichier JavaScript externe -->
    <script src="js/connexion.js"></script>
</body>
</html>
